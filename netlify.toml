[build]
  command = "cd sac-react && npm install && npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[redirects]]
  from = "/financeiro/*"
  to = "/sac-react/dist/:splat"
  status = 200

[[redirects]]
  from = "/financeiro"
  to = "/sac-react/dist/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

