[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/financeiro/*"
  to = "/sac-react/dist/:splat"
  status = 200

[[redirects]]
  from = "/financeiro"
  to = "/sac-react/dist/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

